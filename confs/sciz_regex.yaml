---
### Regexps configuration for SCIZ ###

# Mail subjects to specifically ignore (even if it matches a known subject)
ignored_subjects:
  message: 'Message de'
  forum: 'Forum'
  forum2: 'Nouveau sujet'
  taniere: 'Entretien'
  taniere2: 'Gestion'
  gardien: 'Gardiennage'
  pass: 'Passe'
  roulotte: 'roulotte'
  hibernation: 'Hibernation'
  don: 'Don de'
  achat: 'Achat'
  gowap_taniere: 'est arrivé pour s''ébrouer sur la tanière'
  auberge: 'Auberge'
  password: 'mot de passe'
  consigne: 'Consigne'
  trollcante: 'Trollcante'
  guilde: 'guilde'

# Known mail subjects to parse (first to match)
# Keys must be 'CLASS_routine' formatted
# (with CLASS the uppercase name of the class to instanciate)
# (with routine the lowercase suffix of the build_suffix routine to call after class instanciation)
# At the moment, the routine mechanism is not used anymore
subjects:
  MailHelper_gmail: '(?s)((Gmail )?Confirmation\s+d[eu]\s+transfert)|((Gmail )?Forwarding\s+Confirmation)'
  MailHelper_yahoo: 'Veuillez vérifier votre adresse mail'
  userEvent_dla: 'Votre (?P<type>DLA est depassée)'
  userEvent_dla_report_activation: '(?P<type>(Report|Activation) de votre DLA)'
  followerEvent: '(?P<follower_nom>.+)\s+\((?P<follower_id>\d+)\)\s+est\s+arrivé(\s+pour\s+s''ébrouer)?\s*$'
  aaEvent: 'Analyse\s+Anatomique\s+sur\s+(?P<troll_nom>.+)\s+\((?P<troll_id>\d+)\)'
  cdmEvent: '(?s)Connaissance\s+des\s+Monstres\s+(?P<cdm_niv>\d)\s+sur\s+(?P<mob_nom>.*)\s+\((?P<mob_id>\d+)\)'
  tpEvent: 'Sortilège\s*:\s*Téléportation'
  cpEvent: 'Compétence\s*:\s*Piège '
  champiEvent_idc: '(?P<type>Identification des (c|C)hampignons)'
  champiEvent_ramasser: '(?P<type>Ramass(er|age)) (d''un )?(c|C)hampignon'
  champiEvent_planter: '(?P<type>Planter) un champignon (?P<nom>.+)\s+(?P<qualite>.+?)\s+\((?P<champi_id>\d+)\)\s+en\s+X\s*=\s*(?P<pos_x>\-?\d+)\s+Y\s*=\s*(?P<pos_y>\-?\d+)\s+N\s*=\s*(?P<pos_n>\-?\d+)'
  tresorEvent_idt: '(?P<type>Identification des (t|T)résors)\s*:\s*(\[(?P<tresor_id>\d+)\]\s+)?(?P<tresor_type>.+)'
  tresorEvent_telek: '(?P<type>Télékinésie)(\s*-\s*(\[(?P<tresor_id>\d+)\]\s+)?(?P<tresor_type>.+))?'
  tresorEvent_bidouille: '(?P<type>Bidouille)\s+sur\s+(\[(?P<tresor_id>\d+)\]\s+)?(\[(?P<tresor_type>Bidouille)\]\s+)?(?P<nom>.+)'
  battleEvent_piege: '(?s)(?P<type>Déclenchement d(u|e) (P|p)iège( sur un suivant)?)'
  battleEvent_piege: '(?s)(?P<type>Déclenchement d(u|e) (P|p)iège( sur un suivant)?)'
  battleEvent_vl: '(?i)(?P<type>Vision lointaine)'
  battleEvent_saisir: '(?i)(?P<type>Saisie).* d'''
  battleEvent_percussion: '(?i)(?P<type>Percution).* d'''
  battleEvent_sort: '(?s)Sortilège(\s*sur\s*Suivant)?\s*:\s*(?P<type>.+?)(\s+en\s+X\s*=\s*(?P<pos_x>\-?\d+)\s*,\s*Y\s*=\s*(?P<pos_y>\-?\d+)\s*,\s*N\s*=\s*(?P<pos_n>\-?\d+))?($|\s+lancé\s+par\s+(?P<att_nom>.+)\s+\((?P<att_id>\d+)\)|\s+sur\s+(?P<def_nom>.+)\s+\((?P<def_id>\d+)\))'
  battleEvent_sort_suivant: '(?s)Sortilège\s+sur\s+Suivant\s*:\s*(?P<type>.+?)\s+lancé\s+par\s+(?P<att_nom>.+)\s+\((?P<att_id>\d+)\)'
  battleEvent_pouvoir: '(?s)pouvoir \"(?P<type>.+)\"\s+d''(?P<att_nom>.+)\s+\((?P<att_id>\d+)\)'
  battleEvent_pouvoir_alt: '(?s)pouvoir du monstre n°(?P<att_id>\d+)\s+\((?P<att_nom>.+)\)'
  battleEvent_pouvoir_ter: '(?s)pouvoir\s+d''(?P<att_nom>.+)\s+\((?P<att_id>\d+)\)'
  battleEvent_pouvoir_enfume: '(?s)Résultat de l.enfumage d.une*\s+(?P<att_nom>.+)\s+\((?P<att_id>\d+)\)'
  battleEvent_marquage: '(?s)(?P<type>Marquage)\s+sur\s+(?P<def_nom>.+)\s+\((?P<def_id>\d+)\)'
  battleEvent_parcho: '(?s)Résultat du (?P<type>Parchemin)$'
  battleEvent_potion: '(?s)Résultat de la (?P<type>Potion)$'
  battleEvent_ldp: '(?s)(?P<flag_ldp>(?P<type>Lancer de Potion)) ((sur (?P<def_nom>.*)\s*\((?P<def_id>\d+)\))|(?P<flag_def>de (?P<att_nom>.*)\s*\((?P<att_id>\d+)\)))'
  battleEvent_inter: '(?s)Attaquant\s*-\s*(Suivant\s*-\s*)?(?P<generic_type>.+?)\s+(\((?P<type>.+)\)\s+)?sur\s+(?P<autre_nom>.+?)\s+\((?P<autre_id>\d+)\)\s+interposée\s+par\s+(?P<def_nom>.+?)\s+\((?P<def_id>\d+)\)'
  battleEvent_att: '(?s)Attaquant\s*-\s*(Suivant\s*-\s*)?(?P<generic_type>.+?)\s+((\(|:\s)(?P<type>.+?)\)?\s+)?sur\s+(?P<def_nom>.+?)\s+\((?P<def_id>\d+)\)\s*$'
  battleEvent_ca: 'Attaquant - (?P<type>Contre-Attaque)'
  battleEvent_def_suiv: '(?s)Défenseur\s*-\s*Suivant\s*:\s*(?P<def_nom>.+)\s+\((?P<def_id>\d+)\)\s*-\s*(?P<type>.+?)\s+(de|d'')(?P<att_nom>.+?)\s+\((?P<att_id>\d+)\)'
  battleEvent_def: '(?s)Défenseur\s*-\s*(Suivant\s*-\s*)?(?P<type>.+?)\s+(de|d'')(?P<att_nom>.+?)\s+\((?P<att_id>\d+)\)'
  battleEvent_balayage_att: '(?s)(?P<type>Balayage)\s+sur\s+(?P<def_nom>.+)\s+\((?P<def_id>\d+)\)'
  battleEvent_insulte: '(?s)(?P<flag_he_insulte>(?P<type>Insultes?))\s*(?P<comp_niv>\d)\s*sur\s*(?P<def_nom>.+)\s+\((?P<def_id>\d+)\)'
  battleEvent_he: '(?s)(?P<flag_he_insulte>(?P<type>Hurlement Effrayant))\s*sur\s*(?P<def_nom>.+)\s+\((?P<def_id>\d+)\)'
  battleEvent_pistage: '(?s)(?P<flag_pistage>(?P<type>Pistage))\s*sur\s*(?P<def_nom>.+)\s+\((?P<def_id>\d+)\)'
  battleEvent_machouillage: '(?s)]\s+(?P<att_nom>.+)\s+\((?P<att_id>\d+)\)\s+(?P<flag_machouillage>a\s+affecté\s+l.un\s+de\s+vos\s+trésors)'
  battleEvent_vol_mouche: '(?s)L''odeur\s+(de|d'')\s*(?P<att_nom>.+?)\s+\((?P<att_id>\d+)\)\s+incommode\s+vos\s+(?P<type>mouches)'
  battleEvent_ra: '(?P<type>Régénération Accrue)'
  battleEvent_am: '(?P<type>Accélération\s+du\s+(M|m)étabolisme)'
  battleEvent_camou: '(?P<type>Camouflage)'
  battleEvent_protection: '(?P<type>Protection)\s+de\s+(?P<att_nom>.+)\s+\((?P<att_id>\d+)\)'
  battleEvent_prog: 'Compétence\s*(:\s*)?(?P<type>Retraite|Parer|Parade|Contre-Attaque|Interposition|S''(I|i)nterposer)(\s+sur\s+(?P<def_nom>.+)\s+\((?P<def_id>\d+)\))?'
  battleEvent_baroufle_def_suiv: '(?P<type>Baroufle)\s+de\s+(?P<att_nom>.+)(?:sur une?\s+)(?P<def_nom>.+)?'
  battleEvent_baroufle_def: '(?P<type>Baroufle)\s+de\s+(?P<att_nom>.+)'
  battleEvent_baroufle_att: '(?P<type>Baroufle)'
  battleEvent_neige: '(?s)((?P<type>Lancer\s+de\s+Boule\s+de\s+Neige)\s+sur\s+(?P<def_nom>.+)\s+\((?P<def_id>\d+)\))'
  battleEvent_painthure: '(?P<type>Painthure de Guerre)'
  battleEvent_dressage: '(?s)(Compétence\s*:\s*(?P<type>Dressage)\s+sur\s+(?P<def_nom>.+)\s+\((?P<def_id>\d+)\))'
  battleEvent_abordement: '(?s)(Compétence\s*:\s*(?P<type>Abordement)\s+sur\s+(?P<def_nom>.+)\s+\((?P<def_id>\d+)\))'
  battleEvent_objet_mort: '(?s)(\]\s*(?P<type>.+?)\s+(?P<flag_dead>mortel(le)?)\s+sur\s+(?P<def_nom>.+)\s+\((?P<def_id>\d+)\))'
  battleEvent_ldp: '(?is)(Compétence\s*:\s*(?P<type>Lancer de Potions*)\s+sur\s+(?P<def_nom>.+)\s+\((?P<def_id>\d+)\))'
  battleEvent_sauttp: '(?is)(?P<type>Prendre un portail)\s+.*en\s+X\s*=*\s*(?P<x0>-*\d+)[\|\s]+Y\s*=*\s*(?P<y0>-*\d+)[\|\s]++N\s*=*\s*(?P<n0>-*\d+)'

# Regexps for the forwarding confirmation mails
MailHelper:
  re_gmail_desc: '(?P<sender>.+)((\s+a\s+demandé\s+à\s+transférer)|(\s+has\s+requested\s+to\s+automatically\s+forward\s+mail))'
  re_gmail_link: '(?P<link>https://mail(?:-settings)?.google.com/mail/[^\n]*)'
  re_yahoo_link: '(?s)<a href=''(?P<link>.+)''>Cliquez ici</a>'

# Regexps common to all MH mails
common:
  # Note : we could (should?) retrieve the owner_id from the mail directory tree parsing
  re_troll: 'Tr(õ|o)ll n°(?P<owner_id>\d+)\s*:\s*(?P<owner_nom>.+)'
  re_suivant: 'Suivant n°(?P<follower_id>\d+)\s*:\s*(?P<follower_nom>.+)'
  re_type: '(Vous avez|Le Suivant n°\d+ a) été impliqué dans un événement : (?P<mh_type>.*)\.'
  re_time: 'Il était alors (aux alentours de )?: (?P<time>.*)\.'
  re_px: 'gagné (un total de )?(?P<px>\d+) PX'
  re_mm: '(?s)(augmenté votre Ma(i|î)trise Magique de (?P<mm>\d+) points?)'
  re_rm: '(?s)(augmenté votre Résistance Magique de (?P<rm>\d+) points?)'

# Regexps for userEvent
userEvent:
  re_time: 'précédente\s+Date\s+Limite\s+d''Action\s+est\s+dépassée\s+\((?P<time>.+?)\)'
  re_time_report_activation: 'Date\s+Limite\s+d''Action\s+précédente\s+était\s+le\s+(?P<old_dla>.+)(\.|$)'
  re_pa: 'reste\s+(?P<pa>\d)\s+(P|p)oints?\s+d''(A|a)ctions?'
  re_dla_report: '(?s)(R|r)epousser\s+au\s+(?P<next_dla>.+?)(\.|\n\n|$)'
  re_dla_activation: 'Date\s+Limite\s+d''Action\s+est\s+donc\s+le\s+(?P<next_dla>.+)(\.|$)'
  re_pdv_full: 'tous\s+vos\s+Points?\s+de\s+Vie\s+\((?P<pdv>\d+)\)'
  re_pdv: '(?P<pdv>\d+)\s+Points?\s+de\s+Vie\s+\(sur\s+(?P<pv_max>\d+)\)'
  re_fatigue: 'Fatigue\s+est\s+actuellement\s+de\s+(?P<fatigue>\d+)\s+\(\+(?P<fatigue_bis>\d+)\)'
  re_concentration:  '(?P<concentration>\d+)\s+(P|p)oints?\s+d''action\s+n''(a|ont)\s+pas'
  re_pos: 'Vous\s+êtes\s+en\s+X\s*=\s*(?P<pos_x>\-?\d+)\s*\|\s*Y\s*=\s*(?P<pos_y>\-?\d+)\s*\|\s*N\s*=\s*(?P<pos_n>\-?\d+)'

# Regexps for followerEvent
followerEvent:
  re_deplacement: 'est\s+arrivé\s+en\s+X\s*=\s*(?P<pos_x>\-?\d+)\s+Y\s*=\s*(?P<pos_y>\-?\d+)\s+N\s*=\s*(?P<pos_n>\-?\d+)(?P<type>\s+et\s+s.ébroue)?'

# Regexps for aaEvent
aaEvent:
  re_niv: 'Niveau.*?(?P<niv>\d+)'
  re_pv: '.*Points de Vie.*(\(entre (?P<pdv_min>\d+) et (?P<pdv_max>\d+)\)|supérieur à (?P<pdv_sup>\d+)|inférieur à (?P<pdv_inf>\d+)|égal à (?P<pdv_eq>\d+)).*'
  re_blessure: '.*Blessure[^\d]*(?P<blessure>\d+).*'
  re_att: 'Attaque.*(\(entre (?P<att_min>\d+) et (?P<att_max>\d+)\)|supérieur à (?P<att_sup>\d+)|inférieur à (?P<att_inf>\d+)|égal à (?P<att_eq>\d+))'
  re_esq: 'Esquive.*(\(entre (?P<esq_min>\d+) et (?P<esq_max>\d+)\)|supérieur à (?P<esq_sup>\d+)|inférieur à (?P<esq_inf>\d+)|égal à (?P<esq_eq>\d+))'
  re_deg: 'Dég(â|à)t.*(\(entre (?P<deg_min>\d+) et (?P<deg_max>\d+)\)|supérieur à (?P<deg_sup>\d+)|inférieur à (?P<deg_inf>\d+)|égal à (?P<deg_eq>\d+))'
  re_reg: 'Rég(é|è)n.*(\(entre (?P<reg_min>\d+) et (?P<reg_max>\d+)\)|supérieur à (?P<reg_sup>\d+)|inférieur à (?P<reg_inf>\d+)|égal à (?P<reg_eq>\d+))'
  re_arm: 'Armure.*(\(entre (?P<arm_min>\d+) et (?P<arm_max>\d+)\)|supérieur à (?P<arm_sup>\d+)|inférieur à (?P<arm_inf>\d+)|égal à (?P<arm_eq>\d+))'
  re_vue: 'Vue.*(\(entre (?P<vue_min>\d+) et (?P<vue_max>\d+)\)|supérieur à (?P<vue_sup>\d+)|inférieur à (?P<vue_inf>\d+)|égal à (?P<vue_eq>\d+))'

# Regexps for cdmEvent
cdmEvent:
  re_type: 'Famille du monstre\s+:\s+(?P<mob_race>.+)'
  re_niv: 'Niveau.*(\(entre (?P<niv_min>\d+) et (?P<niv_max>\d+)\)|supérieure?s? à (?P<niv_sup>\d+)|inférieure?s? à (?P<niv_inf>\d+)|égale?s? à (?P<niv_eq>\d+))'
  re_pv: '.*Points de Vie.*(\(entre (?P<pdv_min>\d+) et (?P<pdv_max>\d+)\)|supérieure?s? à (?P<pdv_sup>\d+)|inférieure?s? à (?P<pdv_inf>\d+)|égale?s? à (?P<pdv_eq>\d+)).*'
  re_blessure: '(?s)(Blessure.*?±(?P<blessure>\d+)%)'
  re_att: 'Attaque.*(\(entre (?P<att_min>\d+) et (?P<att_max>\d+)\)|supérieure?s? à (?P<att_sup>\d+)|inférieure?s? à (?P<att_inf>\d+)|égale?s? à (?P<att_eq>\d+))'
  re_esq: 'Esquive.*(\(entre (?P<esq_min>\d+) et (?P<esq_max>\d+)\)|supérieure?s? à (?P<esq_sup>\d+)|inférieure?s? à (?P<esq_inf>\d+)|égale?s? à (?P<esq_eq>\d+))'
  re_deg: 'Dég(â|à)t.*(\(entre (?P<deg_min>\d+) et (?P<deg_max>\d+)\)|supérieure?s? à (?P<deg_sup>\d+)|inférieure?s? à (?P<deg_inf>\d+)|égale?s? à (?P<deg_eq>\d+))'
  re_reg: 'Rég(é|è)n.*(\(entre (?P<reg_min>\d+) et (?P<reg_max>\d+)\)|supérieure?s? à (?P<reg_sup>\d+)|inférieure?s? à (?P<reg_inf>\d+)|égale?s? à (?P<reg_eq>\d+))'
  re_arm: '(?s)\n\s*Dés\s*d''\s*Armure\s*:[^\n]*?(\(entre (?P<arm_min>\d+) et (?P<arm_max>\d+)\)|supérieure?s? à (?P<arm_sup>\d+)|inférieure?s? à (?P<arm_inf>\d+)|égale?s? à (?P<arm_eq>\d+))'
  re_arm_phy: '(?s)\n\s*Armure( Physique)?\s*:[^\n]*?(\(entre (?P<arm_phy_min>\d+) et (?P<arm_phy_max>\d+)\)|supérieure?s? à (?P<arm_phy_sup>\d+)|inférieure?s? à (?P<arm_phy_inf>\d+)|égale?s? à (?P<arm_phy_eq>\d+))'
  re_arm_mag: 'Armure Magique.*(\(entre (?P<arm_mag_min>\d+) et (?P<arm_mag_max>\d+)\)|supérieure?s? à (?P<arm_mag_sup>\d+)|inférieure?s? à (?P<arm_mag_inf>\d+)|égale?s? à (?P<arm_mag_eq>\d+))'
  re_vue: 'Vue.*(\(entre (?P<vue_min>\d+) et (?P<vue_max>\d+)\)|supérieure?s? à (?P<vue_sup>\d+)|inférieure?s? à (?P<vue_inf>\d+)|égale?s? à (?P<vue_eq>\d+))'
  re_mm: 'Maitrise Magique.*(\(entre (?P<mm_min>\d+) et (?P<mm_max>\d+)\)|supérieure?s? à (?P<mm_sup>\d+)|inférieure?s? à (?P<mm_inf>\d+)|égale?s? à (?P<mm_eq>\d+))'
  re_rm: 'Résistance Magique.*(\(entre (?P<rm_min>\d+) et (?P<rm_max>\d+)\)|supérieure?s? à (?P<rm_sup>\d+)|inférieure?s? à (?P<rm_inf>\d+)|égale?s? à (?P<rm_eq>\d+))'
  re_capa: '(?s)Capacité spéciale :\s+(Aucune|(?P<capa_desc>.*?) -( Affecte : )?(?P<capa_effet>.*\||.*?\n)(\s*Durée\s+(?P<capa_tour>\d+)\s+tour\(s\))?)'
  re_nb_att: 'Nombre d''attaques :\s+(?P<nb_att_tour>\d+)'
  re_vit_dep: 'Vitesse de Déplacement :\s+(?P<vit_dep>.+)'
  re_vlc: 'Voir le Caché :\s+(?P<vlc>.+)'
  re_voleur: 'Vole :\s+(?P<voleur>.+)'
  re_att_dist: 'Attaque à distance :\s+(?P<att_dist>.+)'
  re_att_mag: 'Attaque magique :\s+(?P<att_mag>.+)'
  re_dla: 'DLA :\s+(?P<dla>.+)'
  re_sang_froid: 'Sang froid :\s+(?P<sang_froid>.+)'
  re_tour: 'Durée (t|T)our.*(\(entre (?P<tour_min>\d+) et (?P<tour_max>\d+)\)|supérieure?s? à (?P<tour_sup>\d+)|inférieure?s? à (?P<tour_inf>\d+)|égale?s? à (?P<tour_eq>\d+))'
  re_chargement: 'Chargement :\s+(?P<chargement>.+)'
  re_bonus_malus: 'Bonus Malus :\s+(?P<bonus_malus>.+)'
  re_portee_capa: 'Portée du Pouvoir :\s+(?P<capa_portee>.+)'

# Regexps for tpEvent
tpEvent:
  re_pos: '(?s)(créé un Portail de Téléportation \((?P<portail_id>\d+)\) en X\s*=\s*(?P<pos_x>\-?\d+)\s*\|\s*Y\s*=\s*(?P<pos_y>\-?\d+)\s*\|\s*N\s*=\s*(?P<pos_n>\-?\d+))'
  re_dst: '(?s)(conduit en : X\s*=\s*(?P<pos_x_dst>\-?\d+)\s*\|\s*Y\s*=\s*(?P<pos_y_dst>\-?\d+)\s*\|\s*N\s*=\s*(?P<pos_n_dst>\-?\d*))'
  re_disp: '(?s)(Erreur de calcul : X\s*=\s*(?P<pos_x_disp>(\-|\+)?\d+)\s*\|\s*Y\s*=\s*(?P<pos_y_disp>(\-|\+)?\d+)\s*\|\s*N\s*=\s*(?P<pos_n_disp>(\-|\+)?\d+))'

# Regexps for cpEvent
cpEvent:
  re_pose: '(?s)(un\s+Piège\s+à\s+(?P<piege_type>.+?)\s+\((?P<piege_id>\d+)\)\s+en\s+X\s*=\s*(?P<pos_x>\-?\d+)\s*\|\s*Y\s*=\s*(?P<pos_y>\-?\d+)\s*\|\s*N\s*=\s*(?P<pos_n>\-?\d+)\s+dont\s+la\s+Maîtrise\s+Magique\s+est\s+de\s+(?P<piege_mm>\-?\d+))'

# Regexps for champiEvent
champiEvent:
  re_idc_ramassage: '(reconnu le|cueillir? un) (c|C)hampignon( :)? (?P<nom>.+)\s+(?P<qualite>.+?)\s+\((?P<champi_id>\d+)\)'
  re_inconnu: 'cueillir? un (c|C)hampignon (i|I)nconnu \((?P<champi_id>\d+)\)'
  re_pos: 'en\s+X\s*=\s*(?P<pos_x>\-?\d+)\s*,\s*Y\s*=\s*(?P<pos_y>\-?\d+)\s*,\s*N\s*=\s*(?P<pos_n>\-?\d+)'
  re_planter_nok: '(?P<flag_planter_nok>Le champignon est détruit)'

# Regexps for tresorEvent
tresorEvent:
  re_idt: 'le résultat suivant\s*:(\s*\[(?P<tresor_id>\d+)\])?\s*(?P<nom>[^\(\[\*]+?)(\s*(?P<mithril>en\sMithril))?(\s*(\(|\[)(?P<effet>[^\)\]]+)(\)|\]))?\n{1,}'
  re_idt_maudite: '(?s)(En identifiant ce parchemin tu viens de subir une (?P<nom>Malédiction))'
  re_idt_pos: 'en\s+X\s*=\s*(?P<pos_x>\-?\d+)\s*,\s*Y\s*=\s*(?P<pos_y>\-?\d+)\s*,\s*N\s*=\s*(?P<pos_n>\-?\d+)'
